<!DOCTYPE html>
<html manifest="../cache.manifest">
<head>
<meta charset="utf-8">
<title>HIMA STORE - AUTO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;text-align:center;padding-top:60px;font-family:Arial}
h1{color:#00ff88;font-size:32px} h2{color:#ccc} #fw{color:#00aaff;font-size:22px;margin-top:20px}
</style>
</head>
<body>
<h1>✦ HIMA STORE ✦</h1>
<h2 id="status">جاري كشف نسخة البلايستيشن...</h2>
<div id="fw"></div>

<script src="./main.js"></script>
<script>
function getPS4FW(){
  try{
    var ua = navigator.userAgent;
    var m = ua.match(/PlayStation 4 (\d+\.\d+)/) || ua.match(/(\d+\.\d+)/);
    if(m) return parseFloat(m[1]);
  }catch(e){}
  return 12.52; // لو بتجرب من الموبايل هيعتبره 12.52
}

var fw = getPS4FW();
document.getElementById('fw').innerHTML = 'السوفت المكتشف: ' + fw;
var status = document.getElementById('status');

setTimeout(function(){
  if(fw >= 6.00 && fw <= 11.02){
    status.innerHTML = 'سوفت ' + fw + ' - سيتم تشغيل Lapse...';
    var s = document.createElement('script');
    s.src = './lapse.js';
    document.body.appendChild(s);
  }
  else if(fw >= 11.50 && fw <= 13.00){
    status.innerHTML = 'سوفت ' + fw + ' - سيتم تشغيل RawGame4...';
    var s = document.createElement('script');
    s.src = './rawgame4-runner.js';
    document.body.appendChild(s);
  }
  else if(fw >= 13.02 && fw <= 13.52){
    status.innerHTML = 'سوفت ' + fw + ' - سيتم تشغيل Raw13G...';
    location.href = './1352/index.html';
  }
  else{
    status.innerHTML = 'سوفت غير مدعوم: ' + fw;
  }
}, 2000);
</script>
</body>
</html>

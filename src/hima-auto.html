<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MAGIC STORE - Auto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh}
h1{color:#00e5ff;font-size:42px;letter-spacing:5px;text-shadow:0 0 20px #00e5ff;margin:0}
#status{margin-top:30px;font-size:20px;color:#00ff88;background:#111;border:1px solid #222;padding:15px 30px;border-radius:30px}
.loader{margin-top:25px;width:50px;height:50px;border:4px solid #222;border-top:4px solid #00e5ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>MAGIC STORE</h1>
<p>Mohamed Ehab</p>
<div class="loader"></div>
<div id="status">جاري التحميل تلقائي...</div>

<script>
// هنا بيشتغل اوتوماتيك من غير زراير
window.onload = function(){
  document.getElementById('status').innerHTML = 'تم التحميل ✅';
  // ضيف هنا السكربت بتاعك اللي عايزه يشتغل اوتوماتيك
}
</script>
</body>
</html>
